name: Deploy Terraform & Lambdas

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_auth_api_key: ${{ secrets.EVO_API_KEY }}
      TF_VAR_whatsapp_version: "latest"
      TF_VAR_redis_url: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      TF_VAR_redis_password: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      TF_VAR_dynamo_table_name: "YourExistingTable"

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install zip
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          python3 -m pip install --upgrade pip

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
