name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CACHE_CLUSTER_ID: ${{ secrets.CACHE_CLUSTER_ID }}
      DYNAMODB_TABLE_NAME: ${{ secrets.DYNAMODB_TABLE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.3


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Docker image
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG:        ${{ env.IMAGE_TAG }}
        run: |
          # login to ECR first…
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $ECR_REGISTRY

          # build using the correct relative path
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./evolution-api-main

          # push it
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # expose for Terraform
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
                      >> $GITHUB_OUTPUT
      - name: Set Terraform env
        run: |
          echo "TF_INPUT=false"                                  >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}"            >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }}"    >> $GITHUB_ENV
          echo "TF_VAR_aws_region=${{ secrets.AWS_REGION }}"     >> $GITHUB_ENV
          echo "TF_VAR_evolutionapi_image=${{ steps.build.outputs.image_uri }}" >> $GITHUB_ENV
          echo "TF_VAR_cache_cluster_id=${{ secrets.CACHE_CLUSTER_ID }}"        >> $GITHUB_ENV
          echo "TF_VAR_dynamodb_table_name=${{ secrets.DYNAMODB_TABLE_NAME }}"  >> $GITHUB_ENV
          echo "TF_VAR_lambda_message_checker_s3_key=${{ secrets.LAMBDA_MESSAGE_CHECKER_S3_KEY }}" \
                                                                    >> $GITHUB_ENV
          echo "TF_VAR_lambda_trigger_api_s3_key=${{ secrets.LAMBDA_TRIGGER_API_S3_KEY }}" \
                                                                    >> $GITHUB_ENV
                                                                    
      - name: Terraform Format
        run: terraform fmt -recursive
        working-directory: terraform

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform
      - name: Debug region env
        run: |
          echo "TF_VAR_aws_region: $TF_VAR_aws_region"
          echo "AWS_REGION: $AWS_REGION"
          echo "AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION"
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        working-directory: terraform

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
        working-directory: terraform