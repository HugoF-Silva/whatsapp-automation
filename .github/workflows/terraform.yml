name: Terraform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # your ECR repo name and a sensible tag
  ECR_REPOSITORY: evolution-api-main
  IMAGE_TAG:       ${{ github.sha }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    # AWS creds + other secrets
    env:
      AWS_REGION:               ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID:        ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:    ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CACHE_CLUSTER_ID:         ${{ secrets.CACHE_CLUSTER_ID }}
      # (no ECR_REGISTRY here—comes from login step)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            ./evolution-api-main

          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

          # expose to Terraform
          echo "image_uri=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" \
            >> $GITHUB_OUTPUT

      - name: Set Terraform env
        run: |
          echo "TF_INPUT=false"                                  >> $GITHUB_ENV
          echo "AWS_REGION=${{ env.AWS_REGION }}"                >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}"        >> $GITHUB_ENV
          echo "TF_VAR_aws_region=${{ env.AWS_REGION }}"         >> $GITHUB_ENV
          echo "TF_VAR_evolutionapi_image=${{ steps.build.outputs.image_uri }}" \
                                                                  >> $GITHUB_ENV
          echo "TF_VAR_cache_cluster_id=${{ secrets.CACHE_CLUSTER_ID }}"        >> $GITHUB_ENV
          echo "TF_VAR_lambda_message_checker_s3_key=${{ secrets.LAMBDA_MESSAGE_CHECKER_S3_KEY }}" \
                                                                  >> $GITHUB_ENV
          echo "TF_VAR_lambda_trigger_api_s3_key=${{ secrets.LAMBDA_TRIGGER_API_S3_KEY }}" \
                                                                  >> $GITHUB_ENV
                                                                    
      - name: Terraform Format
        run: terraform fmt -recursive
        working-directory: terraform

      - name: Terraform Init
        run: terraform init
        working-directory: terraform



      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Debug region env
        run: |
          echo "TF_VAR_aws_region: $TF_VAR_aws_region"
          echo "AWS_REGION: $AWS_REGION"
          echo "AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION"

      - name: Terraform Import ElastiCache Cluster
        working-directory: terraform
        run: |
          # Check if the resource is already in state; if not, import it
          if ! terraform state list aws_elasticache_cluster.external >/dev/null 2>&1; then
            echo "Importing existing ElastiCache cluster (${CACHE_CLUSTER_ID}) into state..."
            terraform import aws_elasticache_cluster.external ${CACHE_CLUSTER_ID}
          else
            echo "ElastiCache cluster already imported; skipping."
          fi

      - name: Terraform Import Existing Lambda Functions
        working-directory: terraform
        run: |
          # message-checker
          if ! terraform state list aws_lambda_function.message_checker >/dev/null 2>&1; then
            echo "Importing Lambda function message-checker into state..."
            terraform import aws_lambda_function.message_checker message-checker
          else
            echo "Lambda message-checker already in state; skipping."
          fi

          # trigger-api
          if ! terraform state list aws_lambda_function.trigger_api >/dev/null 2>&1; then
            echo "Importing Lambda function trigger-api into state..."
            terraform import aws_lambda_function.trigger_api trigger-apilat29
          else
            echo "Lambda trigger-api already in state; skipping."
          fi

      - name: Terraform Import Existing Lambda Function URLs
        working-directory: terraform
        run: |
          # message-checker Function URL
          if ! terraform state list aws_lambda_function_url.message_checker >/dev/null 2>&1; then
            echo "Importing Lambda Function URL for message-checker into state..."
            terraform import aws_lambda_function_url.message_checker message-checker
          else
            echo "Lambda Function URL for message-checker already in state; skipping."
          fi

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        working-directory: terraform

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
        working-directory: terraform