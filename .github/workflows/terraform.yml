name: Deploy Terraform & Lambdas

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_auth_api_key: ${{ secrets.EVO_API_KEY }}
      TF_VAR_evo_api_url: ${{ secrets.EVO_API_URL }}
      TF_VAR_redis_url: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      TF_VAR_redis_password: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      TF_VAR_dynamo_table_name: "${{ secrets.DYNAMODB_TABLE_NAME }}"
      TF_VAR_deployment_id: "${{ github.run_id }}"
      TF_VAR_lambda_code_bucket: ${{ secrets.LAMBDA_CODE_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"
      
      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Bootstrap Lambda S3 bucket if missing
        run: |
          set -e
          BUCKET="${{ secrets.LAMBDA_CODE_BUCKET }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET already exists, skipping creation."
          else
            echo "Bucket $BUCKET does not exist. Bootstrapping with Terraform."
            cd terraform-bootstrap
            terraform init
            terraform apply -auto-approve \
              -var="aws_region=${{ secrets.AWS_REGION }}" \
              -var="lambda_code_bucket=${{ secrets.LAMBDA_CODE_BUCKET }}"
            cd ..
          fi

      - name: Install zip & upgrade pip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          python3 -m pip install --upgrade pip

      - name: Build message-checker Lambda zip
        run: |
          cd lambda/message-checker
          pip install -r requirements.txt -t package/
          cp handler.py gemini.py package/
          cd package
          zip -r ../message-checker.zip .
          cd ..
          mkdir -p ../../terraform/build
          cp message-checker.zip ../../terraform/build/
          
      - name: Build trigger-api Lambda zip
        run: |
          cd lambda/trigger-api
          pip install -r requirements.txt -t package/
          cp handler.py data_store.py config.py models.py schema.py utils.py package/
          cd package
          zip -r ../trigger-api.zip .
          cd ..
          mkdir -p ../../terraform/build
          cp trigger-api.zip ../../terraform/build/

      - name: Upload trigger-api Lambda zip to S3
        run: |
          aws s3 cp terraform/build/trigger-api.zip s3://${{ secrets.LAMBDA_CODE_BUCKET }}/lambda/trigger-api.zip

      - name: Upload message-checker Lambda zip to S3
        run: |
          aws s3 cp terraform/build/message-checker-api.zip s3://${{ secrets.LAMBDA_CODE_BUCKET }}/lambda/message-checker.zip

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan