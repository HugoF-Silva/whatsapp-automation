name: Deploy Terraform & Lambdas

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_auth_api_key: ${{ secrets.EVO_API_KEY }}
      TF_VAR_evo_api_url: ${{ secrets.EVO_API_URL }}
      TF_VAR_redis_url: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      TF_VAR_redis_password: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      TF_VAR_dynamo_table_name: "${{ secrets.DYNAMODB_TABLE_NAME }}"
      TF_VAR_deployment_id: "${{ github.run_id }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install zip & upgrade pip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          python3 -m pip install --upgrade pip

      - name: Build message-checker Lambda zip
        run: |
          cd lambda/message-checker
          pip install -r requirements.txt -t package/
          cp handler.py gemini.py package/
          cd package
          zip -r ../message-checker.zip .
          cd ..
          mkdir -p ../../terraform/build
          cp message-checker.zip ../../terraform/build/
          
      - name: Build trigger-api Lambda zip
        run: |
          cd lambda/trigger-api
          pip install -r requirements.txt -t package/
          cp handler.py data_store.py config.py models.py schema.py utils.py package/
          cd package
          zip -r ../trigger-api.zip .
          cd ..
          mkdir -p ../../terraform/build
          cp trigger-api.zip ../../terraform/build/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan