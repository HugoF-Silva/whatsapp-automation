name: Terraform CI/CD

on:
  push:       { branches: [ main ] }
  pull_request: { branches: [ main ] }

env:
  ECR_REPOSITORY: evolution-api-main
  IMAGE_TAG:      ${{ github.sha }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_REGION:            ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with: { terraform_version: "1.5.3" }

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Mirror Postgres & Redis to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker pull postgres:15
          docker tag postgres:15 $ECR_REGISTRY/postgres:15
          docker push $ECR_REGISTRY/postgres:15

          docker pull redis:latest
          docker tag redis:latest $ECR_REGISTRY/redis:latest
          docker push $ECR_REGISTRY/redis:latest

      - name: Build & Push Docker image (compose)
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        working-directory: evolution-api-main
        run: |
          docker system prune -f -a --volumes
          docker compose -f docker-compose.yaml build --no-cache
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Mirror Postgres & Redis to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Postgres
          PG_TAG=15
          docker pull postgres:$PG_TAG
          docker tag postgres:$PG_TAG $ECR_REGISTRY/postgres:$PG_TAG
          docker push $ECR_REGISTRY/postgres:$PG_TAG

          # Redis
          REDIS_TAG=latest
          docker pull redis:$REDIS_TAG
          docker tag redis:$REDIS_TAG $ECR_REGISTRY/redis:$REDIS_TAG
          docker push $ECR_REGISTRY/redis:$REDIS_TAG

      - name: Set Terraform env
        run: |
          echo "TF_INPUT=false"                                  >> $GITHUB_ENV
          echo "AWS_REGION=${{ env.AWS_REGION }}"                >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}"        >> $GITHUB_ENV
          echo "TF_VAR_aws_region=${{ env.AWS_REGION }}"         >> $GITHUB_ENV
          echo "TF_VAR_evolutionapi_image=${{ steps.push-image.outputs.image_uri }}" \
                                                                  >> $GITHUB_ENV
          echo "TF_VAR_deployment_id=${{ github.run_id }}" >> $GITHUB_ENV
                                                                    
      - name: Terraform Format
        run: terraform fmt -recursive
        working-directory: terraform

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Debug region env
        run: |
          echo "TF_VAR_aws_region: $TF_VAR_aws_region"
          echo "AWS_REGION: $AWS_REGION"
          echo "AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION"

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        working-directory: terraform

      - name: Build Lambda zip for trigger_api
        run: |
          cd lambda/trigger-api
          zip -r ../../terraform/trigger_api.zip .
        shell: bash

      - name: Build Lambda zip for message_checker
        run: |
          cd lambda/message-checker
          zip -r ../../terraform/message_checker.zip .
        shell: bash

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
        working-directory: terraform