name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.3

      - name: Set Terraform env
        run: |
          echo "TF_INPUT=false"           >> $GITHUB_ENV
          echo "TF_VAR_aws_region=${{ secrets.AWS_REGION }}"            >> $GITHUB_ENV
          echo "TF_VAR_evolutionapi_image=${{ steps.build.outputs.image_uri }}" >> $GITHUB_ENV
          echo "TF_VAR_cache_cluster_id=${{ env.CACHE_CLUSTER_ID }}"     >> $GITHUB_ENV
          echo "TF_VAR_dynamodb_table_name=${{ env.DYNAMODB_TABLE_NAME }}">> $GITHUB_ENV

      - name: Terraform Format
        run: terraform fmt -recursive
        working-directory: terraform

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        working-directory: terraform

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
        working-directory: terraform