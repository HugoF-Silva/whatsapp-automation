name: CI/CD—Terraform + ECR

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_gemini_secret_arn: ${{ secrets.GEMINI_SECRET_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # — Build & Push EvolutionAPI Docker Image —
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push EvolutionAPI
        run: |
          IMAGE_URI=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/evolutionapi:${{ github.sha }}
          docker build -t $IMAGE_URI ./evolutionapi
          docker push $IMAGE_URI
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}

      # — Package Orchestrator Lambda —
      - name: Package Lambda
        run: |
          cd lambda-orchestrator
          pip install -r requirements.txt -t package
          cp handler.py package/
          cd package
          zip -r ../orchestrator.zip .
          cd ..

      # — Terraform Deploy —
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_evolutionapi_image_tag: ${{ github.sha }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -input=false tfplan
